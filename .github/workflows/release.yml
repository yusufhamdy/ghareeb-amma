name: Release

# Production release of the static site (Firebase Hosting only).
#
# Triggered ONLY by a push to `main`. The job refuses to run unless the triggering commit is the current tip of
# origin/main, so an older run can never overwrite a newer release. It installs exactly the locked dependencies,
# runs the full test suite (with Chromium for the browser tests) and deploys nothing if anything fails. After
# the deploy it runs a smoke check against the live site and fails loudly if the site, its security headers or
# its Quran font are not right.
#
# Not deployed here: the Firestore rules (deployed by hand, with the owner's approval) and Cloud Functions (none:
# the project is on the free Spark plan; firebase.json has no functions entry).
#
# Authentication: Workload Identity Federation, limited to refs/heads/main (no long-lived key).
# Do not run `firebase deploy` locally in parallel with a run.

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Production release (main only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (full history for latest-main check)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
          cache: npm

      - name: Verify this commit is the latest origin/main
        run: |
          git fetch --no-tags origin main
          if [ "$(git rev-parse origin/main)" != "${GITHUB_SHA}" ]; then
            echo "Not the latest origin/main; refusing to release."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      - name: Run the full test suite (no deploy on any failure)
        run: npm test

      - name: Check the CSP hashes match the pages being deployed
        run: node scripts/csp-update.mjs --check

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Deploy Hosting
        run: npx firebase deploy --only hosting --project ghareebalquran-d9ae5 --non-interactive

      - name: Smoke check the live site
        run: node scripts/smoke-live.mjs https://ghareebalquran.com
