name: Preview

# Phase 5B T6 - Hosting preview channel.
#
# Deploys HOSTING ONLY. It never deploys functions, Firestore rules, indexes,
# or emulator configuration.
#
# Gating: the job is inert until the owner enables previews by setting the
# repository variable PREVIEW_ENABLED=true at Gate G2. Fork PRs can never reach
# the deploy step (they get no secrets and are excluded by the `if` condition).
#
# Deployment policy: GitHub Actions is the single official deployment path from
# this point on. Do not run `firebase deploy` locally in parallel with a run.

# DISABLED (2026-10-27): this workflow can no longer deploy. It authenticates with the repository secret
# FIREBASE_SERVICE_ACCOUNT, which does not exist, and the project's Workload Identity provider now accepts only
# refs/heads/main, so a branch or pull-request run cannot get a deploy identity either. Previews are deployed by
# hand (firebase hosting:channel:deploy preview). The trigger is manual only, so it never runs on its own.
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Hosting preview channel
    if: >-
      vars.PREVIEW_ENABLED == 'true' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy Hosting-only preview channel
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ghareebalquran-d9ae5
          expires: 7d
