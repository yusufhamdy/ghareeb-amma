<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أنماط البلاطات</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0E1F;--tx:#ECEFFA;--mu:#A3ABC9;--ac:#9FB4FF}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans Arabic',sans-serif;line-height:1.7;transition:background .3s}
.w{max-width:900px;margin:0 auto;padding:20px 20px 80px}h1{font-family:'Amiri Quran',serif;font-weight:400;font-size:34px;margin:6px 0}h2{font-size:18px;margin:34px 0 4px}.m{color:var(--mu);font-size:13px;font-family:'IBM Plex Mono','IBM Plex Sans Arabic',monospace}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;border-bottom:1px solid #8884}
.bar button,.btn{font:inherit;font-size:13px;padding:6px 14px;border-radius:18px;border:1px solid var(--mu);background:transparent;color:var(--tx);cursor:pointer}.bar button.on{background:var(--tx);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}@media(min-width:700px){.grid{grid-template-columns:repeat(6,1fr)}}
.tile{position:relative;aspect-ratio:1;border-radius:28%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:8px 6px 10px;text-align:center;background-size:cover;background-position:center;box-shadow:0 0 0 1px #ffffff14 inset}
.tile .q{font-family:'Amiri Quran',serif;font-size:20px;line-height:1.35}
.row{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid #8883}.row .tile{width:64px;flex:none;padding:0}.row .q{font-family:'Amiri Quran',serif;font-size:26px;color:var(--ac);min-width:110px}
.big{aspect-ratio:1.25;max-width:420px;margin:12px 0;border-radius:12%;padding:18px}.big .q{font-size:46px}
.names{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;font-size:12px;text-align:center;color:var(--mu)}
</style></head><body><div class="w">
<h1>أنماط البلاطات</h1><div class="m">ستة أشكال من عائلة واحدة: نفس الحقل ونفس الإضاءة، والنواة الداكنة هي اللي بتتحرك. الثلث الأسفل دايمًا هادئ عشان النص يتقرا.</div>

document.getElementById('res').innerHTML=DATA.slice(0,5).map(x=>`<div class="row"><div class="tile" style="${bi(pat(x.id))}"></div><div class="q">${x.w}</div><div><div style="font-size:15px">${x.m}</div><div class="m">${x.id.split('-')[0]} · ${x.a}</div></div></div>`).join('');draw(0)}
function draw(r){let i;do{i=Math.floor(Math.random()*DATA.length)}while(i===cur&&r);cur=i;const x=DATA[i],b=document.getElementById('big');b.setAttribute('style',bi(document.getElementById('rn').checked?Math.floor(Math.random()*6):pat(x.id)));document.getElementById('bw').textContent=x.w;document.getElementById('bm').textContent=x.m}
document.getElementById('bar').innerHTML=Object.keys(PAL).map(k=>`<button data-p="${k}">${PAL[k][0]}</button>`).join('')+'<button data-n="1">ليل</button><button data-n="0">نهار</button>';
document.addEventListener('click',e=>{const b=e.target.closest('#bar button');if(b){if(b.dataset.p)P=b.dataset.p;else N=b.dataset.n==='1';vars();tiles();return}if(e.target.id==='dr')draw(1)});
vars();tiles();
</script></body></html>
