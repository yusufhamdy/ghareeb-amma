<style>
:root{--bg:#0A1128;--card:#162242;--text:#F8FAFC;--muted:#94A3B8;--accent:#38BDF8;--border:#1E293B;}
*{box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Tajawal',system-ui,sans-serif;margin:0;padding:32px 16px;min-height:100vh;display:flex;justify-content:center;}
.wrap{width:100%;max-width:520px;text-align:center;}
.badge{display:inline-block;font-size:13px;font-weight:500;color:var(--accent);border:1.5px solid var(--accent);border-radius:999px;padding:3px 14px;margin-bottom:10px;}
h1.surah{color:var(--accent);font-size:22px;margin:0 0 22px;font-weight:700;}
.card{background:var(--card);border:2px solid var(--border);border-radius:12px;padding:26px 18px;}
.word{font-size:clamp(30px,8vw,38px);line-height:2;margin:0 0 14px;}
.ayah-ref{display:inline-block;font-size:12px;font-weight:700;color:var(--muted);background:rgba(148,163,184,.12);border-radius:999px;padding:2px 12px;margin-bottom:8px;}
.ayah{font-size:clamp(15px,4vw,17px);line-height:2.1;color:var(--muted);margin:0 0 20px;}
.hl{background:rgba(56,189,248,.16);color:#7DD3FC;font-weight:700;padding:0 .15em;border-radius:4px;}
.meaning{font-size:19px;line-height:1.8;background:rgba(0,0,0,.2);border-right:3px solid var(--accent);border-radius:6px;padding:14px 16px;margin:0;text-align:right;}
.source{margin-top:16px;font-size:13px;color:var(--muted);}
.cta{display:inline-block;margin-top:28px;background:var(--accent);color:#0A1128;font-weight:700;text-decoration:none;border-radius:8px;padding:12px 26px;font-size:16px;}
footer{margin-top:24px;font-size:12px;color:var(--muted);line-height:1.8;}
footer a{color:var(--accent);}
</style>
</head>
<body>
<div class="wrap">
  <span class="badge">جزء عمّ</span>
  <h1 class="surah">سورة الليل</h1>
  <div class="card">
    <p class="word">﴿ تَرَدَّى ﴾</p>
    <span class="ayah-ref">الآية 11</span>
    <p class="ayah">﴿ وَمَا يُغۡنِي عَنۡهُ مَالُهُۥٓ إِذَا <mark class="hl">تَرَدَّىٰٓ</mark> ﴾</p>
    <p class="meaning">السقوط والهلاك في النار.</p>
    <p class="source">المصدر: التفسير الميسر وكتب التفاسير</p>
  </div>
  <a class="cta" href="https://ghareebalquran.com/">🔙 جرّب كلمات تانية على غريب عمّ</a>
  <footer>
    <p>جزء من <a href="https://ghareebalquran.com/">غريب عمّ</a> — كلمات جزء عمّ الغريبة ومعانيها.</p>
  </footer>
</div>
