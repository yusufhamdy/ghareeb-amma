<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحديث ملف غريب عمّ</title>
<style>
  body { font-family: system-ui, Tahoma, sans-serif; background: #0A1128; color: #F8FAFC; max-width: 560px; margin: 0 auto; padding: 28px 16px; line-height: 1.9; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: #94A3B8; margin: 0 0 16px; }
  input[type=file] { display: block; width: 100%; padding: 14px; background: #162242; color: #F8FAFC; border: 2px dashed #38BDF8; border-radius: 10px; margin-bottom: 16px; }
  button { font: inherit; font-weight: 700; padding: 12px 22px; background: #38BDF8; color: #0A1128; border: 3px solid #F8FAFC; box-shadow: 4px 4px 0 #F8FAFC; cursor: pointer; }
  #result { margin: 18px 0; padding: 12px 14px; background: #162242; border-radius: 10px; display: none; }
  .bad { color: #FCA5A5; font-size: 14px; word-break: break-word; }
  .ok { color: #86EFAC; font-weight: 700; }
</style>
</head>
<body>
<h1>تحديث ملف غريب عمّ</h1>
<p>اختر ملف <b>index.html</b> الحالي بتاعك، وهتتطبّق عليه تعديلات مراجعة المعاني ولون الهايلايت وصياغة المصدر، وبعدها تنزّل النسخة الجديدة. كل ده بيتم جوه المتصفح ومفيش حاجة بتترفع لأي مكان.</p>
<input type="file" id="pick" accept=".html,text/html">
<div id="result"></div>
<button id="dl" style="display:none">تنزيل index.html المحدّث</button>

<script>
// [النص القديم، النص الجديد]: تعديلات معاني الكلمات (مقارنة بالتفسير الميسر وكتب التفاسير)
const DEFS = [
 ["الشيطان الذي ينكمش ويختفي فوراً عند ذكر الله.", "الشيطان الذي يوسوس، ويتأخر ويختفي إذا ذُكر الله."],
 ["شدة ظلمة الليل وقت انتشار الشرور.", "الليل إذا اشتد ظلامه ودخل على الناس، وما فيه من شرور ومؤذيات."],
 ["السواحر اللاتي ينفخن في العقد.", "السواحر اللاتي ينفخن في العُقَد التي يعقدنها للسحر."],
 ["السيد الذي تقصده المخلوقات في حوائجها.", "الذي يقصده جميع الخلق في حوائجهم."],
 ["ألا يكون له مساوٍ أو شبيه.", "مماثلًا؛ أي لا أحد من خلقه يماثله أو يشبهه."],
 ["الحبل الخشن القوي المفتول.", "ليف خشن شديد يُفتل منه حبل محكم."],
 ["المقطوع الأثر والذكر.", "المقطوع من كل خير، المنقطع الذكر والأثر."],
 ["الألفة والتعود على النعمة حتى تصبح روتيناً ينسيهم شكر المنعم.", "ألفتهم واعتيادهم رحلتي الشتاء إلى اليمن والصيف إلى الشام في أمان."],
 ["الأدوات البسيطة المستعارة بين البيوت.", "الأشياء البسيطة التي لا يضر إعارتها، كالإناء والدلو والفأس."],
 ["دفع اليتيم بقسوة وزجره.", "يدفع اليتيم بعنف وشدة عن حقه، ولا يرحمه."],
 ["ورق الشجر المأكول والمطحون.", "أوراق الزرع اليابسة التي أكلتها البهائم ثم رمتها."],
 ["الطين الصلب المتحجر بالنار.", "حجارة من طين متحجّر."],
 ["النار التي يهوي فيها الكافر على رأسه.", "اسم من أسماء النار، ومأوى من خفّت موازين حسناته."],
 ["ملائكة العذاب الغلاظ الشداد.", "ملائكة العذاب، وهم خزنة جهنم."],
 ["أثقل ظهرك حتى سُمع له صوت طقطقة من ثقل الهم.", "الذي أتعبك حتى كاد أن يكسر ظهرك."],
 ["سكون الليل واستقراره.", "الليل إذا سكن واشتد ظلامه."],
 ["أبغضك وكرهك وتركك.", "أبغضك."],
 ["العقل الراجح المانع من القبيح.", "العقل؛ سُمّي حِجْرًا لأنه يمنع صاحبه مما لا يحل ولا ينبغي."],
 ["خلط الحلال بالحرام وأكل الحقوق بجشع.", "أكلًا شديدًا لحقوق الضعفاء من النساء واليتامى دون النظر في حلاله وحرامه."],
 ["الشوك اليابس المر بالنار.", "نبات ذو شوك من أخبث الطعام وأبشعه، لا يُشبع ولا يُسمن."],
 ["الزبد ورغوة النبات الجاف المتحول للون الأسود المائل للخضرة.", "نبات يابس متكسّر صار لونه أسود."],
 ["عظام الصدر.", "عظام الصدر عند المرأة."],
 ["الصدأ الأسود الذي يغطي القلب من الذنوب.", "الصدأ الذي غطّى قلوبهم وحجبها بسبب كثرة ذنوبهم."],
 ["النجوم المستترة.", "النجوم التي تختفي أنوارها نهارًا، فتجري وتستتر في أبراجها."],
 ["صيحة القيامة الشديدة.", "صيحة القيامة التي تَصُمّ الأسماع من هولها."],
 ["القيامة الكبرى التي تطم على كل شيء.", "القيامة الكبرى وشدتها العظمى."],
 ["الحالة الأولى قبل الموت (الحياة).", "الحياة الأولى التي كانوا عليها قبل الموت."]
];

// تعديلات أخرى: لون الهايلايت + صياغة المصدر
const OTHER = [
 [".ayah-hl { color: var(--accent-color); font-weight: 700; }",
  ".ayah-hl { background: rgba(56, 189, 248, 0.16); color: #7DD3FC; font-weight: 700; padding: 0 0.15em; border-radius: 4px; }"],
 [/box\.innerText\s*=\s*"[^"]*"\s*\+\s*src;/, 'box.innerText = "شرح مبسّط مستفاد من التفسير الميسر وكتب التفاسير";'],
 [/الشروح مبسّطة ومستفادة من[^.]*\./, "الشروح مبسّطة ومستفادة من التفسير الميسر وكتب التفاسير."],
 [/المصدر: تفسير السعدي - معجم لسان العرب/g, "المصدر: التفسير الميسر وكتب التفاسير"]
];

function count(text, f) {
  return f instanceof RegExp ? (text.match(new RegExp(f.source, "g")) || []).length : text.split(f).length - 1;
}
function apply(text) {
  const failed = []; let done = 0;
  for (const [f, r] of [...DEFS, ...OTHER]) {
    if (count(text, f) === 0) { failed.push(f instanceof RegExp ? f.source : f); continue; }
    text = f instanceof RegExp ? text.replace(f, r) : text.split(f).join(r);
    done++;
  }
  return { text, done, total: DEFS.length + OTHER.length, failed };
}

if (typeof document !== "undefined" && document.getElementById("pick")) {
  let out = null;
  document.getElementById("pick").addEventListener("change", async e => {
    const file = e.target.files[0]; if (!file) return;
    const res = apply(await file.text());
    out = res.text;
    const box = document.getElementById("result");
    box.style.display = "block";
    box.innerHTML = `<div class="ok">تم تطبيق ${res.done} من ${res.total} تعديل.</div>` +
      (res.failed.length ? `<p>التعديلات دي ما لقيتش مكانها في الملف (غالباً اتعدّلت قبل كده):</p>` +
        res.failed.map(x => `<div class="bad">• ${x}</div>`).join("") : "");
    document.getElementById("dl").style.display = "inline-block";
  });
  document.getElementById("dl").addEventListener("click", () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([out], { type: "text/html" }));
    a.download = "index.html"; a.click();
  });
}
</script>
</body>
</html>
