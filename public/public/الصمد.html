
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta name="theme-color" content="#0A1128">

    <style>
        body { background-color: #0A1128; color: #F8FAFC; font-family: 'Tajawal', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: #162242; padding: 40px 30px; border-radius: 15px; border: 2px solid #1E293B; max-width: 600px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

</head>

    <div class="card">
        <span class="surah-name">سورة الإخلاص • الآية 2</span>
        <h1>معنى كلمة " الصمد "</h1>
        
        <div class="ayah">﴿ ٱللَّهُ <mark style="background: rgba(56, 189, 248, 0.16); color: #7DD3FC; font-weight: bold; padding: 0 4px; border-radius: 4px;">ٱلصَّمَدُ</mark> ﴾</div>
        
        <div class="meaning">
            الذي يقصده جميع الخلق في حوائجهم.
        </div>

        <a href="/" class="back-btn">تصفح باقي الكلمات (بحث وسحب)</a>
    </div>
