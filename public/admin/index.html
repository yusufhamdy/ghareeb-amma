<!doctype html>

<head>

<style>
:is(a,button,input,select,textarea,summary,[tabindex]):focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#app{max-width:760px}
.in{width:100%;min-height:46px;border-radius:14px;padding:10px 14px;border:1px solid var(--gbr);background:var(--gb);color:var(--tx);font:inherit;font-size:16px}
/* Quran text fields (word, ayah, its parts, surah name) use the visitors' Quran face (site.css .q) */
.in.q{font-family:'KFGQPC Uthmanic Hafs','Amiri Quran',serif;font-size:20px}
textarea.in{min-height:84px;resize:vertical;line-height:1.7}
select.in{appearance:auto}
.in[aria-invalid="true"]{border-color:var(--dg,#b8402c);box-shadow:0 0 0 1px var(--dg,#b8402c)}
.ferr{margin-top:6px}
.tabs{display:flex;gap:8px;overflow:auto;margin:0 0 16px;padding-bottom:4px}
.tabs button{flex:none;min-height:44px;padding:0 16px;border-radius:22px;font-size:14px}
.tabs .on{background:var(--ac);color:var(--btf);font-weight:500}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar .in{flex:1;min-width:140px}
.lb{display:block;font-size:13px;color:var(--mu);margin:12px 0 6px}
.dg{color:var(--dg,#b8402c)}
.sm2{min-height:44px;padding:0 14px;border-radius:22px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.sm2 svg{flex:none}
/* toasts sit above every window and dialog; with a window open they move to the top so they never cover its buttons */
#toast{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:90%;padding:12px 20px;border-radius:20px;display:none;font-size:14px}
#toast.bad{color:var(--dg,#b8402c)}
html.lock #toast{top:calc(12px + env(safe-area-inset-top,0px));bottom:auto}
/* a window or dialog is open: the page behind does not scroll */
html.lock,html.lock body{overflow:hidden}
/* windows: header (title and close), scrolling body, footer with the actions that always stays visible. The height
   follows the visible viewport (--vvh, set from visualViewport) so the phone keyboard never hides the footer. */
#md{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.mb{width:min(640px,100%);max-height:94vh;max-height:calc(var(--vvh,100dvh) - 12px);display:flex;flex-direction:column;overflow:hidden;border-radius:28px 28px 0 0;background:var(--sh);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--gbr)}
.mh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px 6px 14px;flex:none}
.mh h2{margin:0;font-size:20px;font-weight:600;line-height:1.4}
.mh .x{flex:none;background:var(--gb);border:1px solid var(--gbr);color:var(--tx);cursor:pointer;padding:0}
.mbd{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;padding:4px 22px 16px}
.mft{flex:none;display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 22px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ln)}
.werr{margin:8px 0 4px;padding:10px 14px;border-radius:16px;border:1px solid color-mix(in srgb,var(--dg,#b8402c) 40%,transparent);color:var(--dg,#b8402c);font-size:14px;line-height:1.7;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button[aria-busy="true"]{opacity:.8;cursor:progress}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-inline-end-color:transparent;display:inline-block;animation:spn .8s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
.sg{display:grid;grid-template-columns:70px 1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.demo{padding:10px 16px;border-radius:16px;margin-bottom:14px;font-size:13px}
.cd{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px}
.cd.open{display:flex}
.cdc{width:min(420px,100%);border-radius:24px;padding:22px;background:var(--sh);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--gbr);display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.cdt{font-size:19px;line-height:1.5}
.cdb{font-size:14px;color:var(--mu);line-height:1.7}
.cdb:empty{display:none}
.cdact{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.cd-yes{background:#b8402c;color:#fff;font-weight:500;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:22px;font-size:14px}
.cd-yes.safe{background:var(--ac);color:var(--btf)}
.cd-yes svg{flex:none}
@media(max-width:600px){.cd{align-items:flex-end;padding:0}.cdc{width:100%;border-radius:26px 26px 0 0;padding:22px 22px calc(24px + env(safe-area-inset-bottom,0px))}}
/* phones: a word's meaning stacks under the word; a surah's word count gets its own line */
@media(max-width:600px){
.wl .row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"w e d" "t t t";column-gap:8px;row-gap:4px;align-items:center}
.wl .row .rw{grid-area:w;min-width:0}.wl .row .t{grid-area:t;min-width:0}.wl .row [data-a="editW"]{grid-area:e}.wl .row [data-a="delW"]{grid-area:d}
.sl .row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-areas:"n s e d" "n c e d";column-gap:10px;align-items:center}
.sl .row .nb{grid-area:n}.sl .row .t{grid-area:s;min-width:0}.sl .row .cnt{grid-area:c}.sl .row [data-a="editS"]{grid-area:e}.sl .row [data-a="delS"]{grid-area:d}
}
</style>
</head>
<body>
<div id="bg"><i class="b1"></i><i class="b2"></i></div>
<main id="app"></main>
<div id="md"></div><div id="toast" class="g" role="status" aria-live="polite"></div>
<div id="cd" class="cd"><div class="cdc" role="alertdialog" aria-modal="true" aria-labelledby="cdt" aria-describedby="cdb"><b id="cdt" class="cdt"></b><div id="cdb" class="cdb"></div><div class="cdact"><button class="g pill" data-cd="no"></button><button class="cd-yes" data-cd="yes"></button></div></div></div>

<script>

const OWNER="yusufhamdy20@gmail.com";
const JUZ="النبأ,النازعات,عبس,التكوير,الانفطار,المطففين,الانشقاق,البروج,الطارق,الأعلى,الغاشية,الفجر,البلد,الشمس,الليل,الضحى,الشرح,التين,العلق,القدر,البينة,الزلزلة,العاديات,القارعة,التكاثر,العصر,الهمزة,الفيل,قريش,الماعون,الكوثر,الكافرون,النصر,المسد,الإخلاص,الفلق,الناس".split(",");
const SRC="المصدر: التفسير الميسر وكتب التفاسير";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const N=s=>String(s).replace(/[ً-ٰٟۖ-ۭـ]/g,"").replace(/[إأآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").trim();
/* Matching only (never stored): the site search normalization, so ي/ئ and و/ؤ spellings find each other (day words of
   days 3 and 21, and the word search). Stored text is never rewritten with it. */
const NM=s=>N(s).replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/\s+/g," ");
const clone=x=>JSON.parse(JSON.stringify(x));
const SVG=p=>'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
const IC_PEN=SVG('<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>');
const IC_TRASH=SVG('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>');
const IC_X=SVG('<path d="M6 6l12 12M18 6 6 18"/>');
const IC_CHECK=SVG('<path d="M5 12l5 5L20 7"/>');
const IC_RETRY=SVG('<path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/>');
const IC_OUT=SVG('<path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/>').replace('<svg ','<svg style="transform:scaleX(-1)" ');
const IC_OPEN=SVG('<path d="M14 4h6v6M20 4 10 14M18 14v6H4V6h6"/>').replace('<svg ','<svg style="transform:scaleX(-1)" ');
const live=()=>{const c=window.FIREBASE_CONFIG;return!!(c&&c.apiKey&&!/PASTE/.test(c.apiKey))};
const nm=e=>e.surah.replace(/^سورة\s*/,"");
const meaning=(e,i)=>{let m=e.meanings[i]||"";const k=m.indexOf(":");return k>0&&N(m.slice(0,k))===N(e.words[i])?m.slice(k+1).trim():m};
const COUNT=n=>n===1?"كلمة واحدة":n===2?"كلمتان":n>=3&&n<=10?n+" كلمات":n+" كلمة";
const DAYS=l=>l.map(d=>"اليوم "+d).join("، ");
const LATER="وسيظهر على الموقع بعد النشر التالي";
const UNDO_NOTE=" يمكنك التراجع من تبويب «أدوات» ما لم تحفظ تعديلًا آخر بعده، ويظهر الحذف على الموقع بعد النشر التالي.";
let FB={},U=null,ADM=false,OWN=false,D=null,AD=[],TAB="s",FS="all",FQ="",ED=null,READY=false,LOADERR=null,SAVING=false,META=null,AERR="",SERR="";
const CL=(typeof window!=="undefined"&&window.ChallengeLogic)||{NOTE:"",SPIN_LABEL:"",validateDayReferences:function(){return[]},rouletteSelect:function(){return null},toTuples:function(x){return Array.isArray(x)?x:[]},toObjects:function(x){return Array.isArray(x)?x:[]}};
let CH=null,CHN={},EDD=null;
function fix(d){d.surahs.forEach(e=>{if(!e.no){const i=JUZ.indexOf(nm(e));e.no=i<0?999:78+i}});return d}
function toast(t,bad){const x=$("#toast");x.textContent=t;x.className="g"+(bad?" bad":"");x.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>x.style.display="none",bad?8000:4500)}

/* ---- errors: every failure becomes a plain sentence; saves never wait forever */
function errOf(code,msg){const e=new Error(msg||code);e.code=code;return e}
function withTimeout(p,ms){let t;return Promise.race([p,new Promise((_,j)=>{t=setTimeout(()=>j(errOf("timeout")),ms)})]).finally(()=>clearTimeout(t))}
const offline=()=>typeof navigator!=="undefined"&&navigator.onLine===false;
function errMsg(e,what){const c=String(e&&(e.code||e.message)||""),w=what||"الحفظ";
 if(/^(offline|unavailable|timeout|deadline-exceeded)$/.test(c)||/offline|network/i.test(String(e&&e.message)))return"تعذّر "+w+": لا يوجد اتصال بالإنترنت أو أن الخادم لا يستجيب.";
 if(c==="permission-denied"||c==="unauthenticated")return"تعذّر "+w+": ليست لديك صلاحية، أو انتهت جلسة الدخول. سجّل الدخول بحساب مشرف ثم أعد المحاولة.";
 if(c==="big")return"تعذّر "+w+": حجم البيانات تجاوز الحد المسموح.";
 if(c==="ref")return"تعذّر "+w+": لم يُحمَّل النص الرسمي للقرآن الكريم، وهو مطلوب للتحقق من نص الآية. تحقّق من الاتصال ثم أعد المحاولة.";
 return"تعذّر "+w+" بسبب خطأ غير متوقع ("+c+").";}
function chkSize(s){if(new Blob([JSON.stringify(s)]).size>950000)throw errOf("big")}

/* ---- the confirm dialog: every question (delete, discard, replace) goes through it, never the browser's confirm() */
let CDYES=null,CDNO=null,CDTRIG=null;
function ask(o){CDYES=o.onYes||null;CDNO=o.onNo||null;CDTRIG=o.trig||document.activeElement;const d=$("#cd"),no=d.querySelector('[data-cd="no"]'),yes=d.querySelector('[data-cd="yes"]');$("#cdt").textContent=o.title;$("#cdb").textContent=o.body||"";no.innerHTML=(o.noIcon||IC_X)+esc(o.no||"إلغاء");yes.innerHTML=(o.danger?IC_TRASH:IC_CHECK)+esc(o.yes);yes.classList.toggle("safe",!o.danger);d.classList.add("open");lock();setTimeout(()=>{try{no.focus()}catch(e){}},0)}
function closeDlg(restore){const d=$("#cd");if(d)d.classList.remove("open");const tr=CDTRIG;CDYES=CDNO=CDTRIG=null;lock();if(restore&&tr&&document.contains(tr)){try{tr.focus()}catch(e){}}}
const dlgOpen=()=>$("#cd").classList.contains("open");
document.addEventListener("click",e=>{const b=e.target.closest("[data-cd]");if(!b)return;const yes=b.dataset.cd==="yes",fn=yes?CDYES:CDNO;closeDlg(!yes);if(fn)fn()});
$("#cd").addEventListener("click",e=>{if(e.target.id==="cd"){const fn=CDNO;closeDlg(true);if(fn)fn()}});
function askDiscard(go,onKeep){ask({title:"لديك تعديلات غير محفوظة. هل تريد تجاهلها؟",yes:"تجاهل",no:"متابعة التعديل",noIcon:IC_PEN,danger:true,onYes:go,onNo:onKeep})}

/* ---- windows: × at the top, Esc, outside click and the back button close them (asking first when there are unsaved
   edits); focus moves in, stays in, and returns to the opener; the page behind does not scroll */
let MD=null,POPSKIP=false,MDDOWN=null;
function lock(){document.documentElement.classList.toggle("lock",!!MD||dlgOpen())}
function winState(){if(!MD)return"";if(MD.kind==="word"||MD.kind==="surah"){if(!ED)return"";const{err,base,warned,gone,...r}=ED;return JSON.stringify(r)}if(MD.kind==="day")return JSON.stringify(EDD?{w:EDD.w,links:EDD.links,note:EDD.note}:null);return""}
const dirty=()=>!!MD&&winState()!==MD.base0;
function selOf(el){if(!el||!el.getAttribute)return null;if(el.id&&el.id!=="app")return"#"+el.id;const f=el.getAttribute("data-f");if(f)return'[data-f="'+f+'"]';const a=el.getAttribute("data-a"),v=el.getAttribute("data-v");if(a)return'[data-a="'+a+'"]'+(v!=null?'[data-v="'+v+'"]':"");return null}
function winHtml(title,body,foot){return`<div class="mb" role="dialog" aria-modal="true" aria-labelledby="mdt"><div class="mh"><h2 id="mdt">${title}</h2><button class="ib x" data-a="close" aria-label="إغلاق">${IC_X}</button></div><div class="mbd">${MD&&MD.err?`<div class="werr" role="alert"><span>${esc(MD.err)}</span>${MD.retry?`<button class="g sm2" data-a="retry">${IC_RETRY}إعادة المحاولة</button>`:""}</div>`:""}${body}</div><div class="mft">${foot}</div></div>`}
function paint(focusSel,fresh){const m=$("#md"),ob=m.querySelector(".mbd"),st=fresh||!ob?0:ob.scrollTop,ae=document.activeElement,keep=focusSel||(!fresh&&ae&&m.contains(ae)?selOf(ae):null);m.innerHTML=MD.render();m.style.display="flex";const nb=m.querySelector(".mbd");if(nb)nb.scrollTop=st;const t=(keep&&m.querySelector(keep))||m.querySelector('[data-a="close"]');if(t)try{t.focus({preventScroll:true})}catch(e){}if(nb)nb.scrollTop=st}
function openWin(kind,render,opener){MD={kind,render,opener:selOf(opener),err:"",retry:null};if(!(history.state&&history.state.win))history.pushState({win:1},"");paint(null,true);MD.base0=winState();lock();fitVV()}
const repaint=focusSel=>{if(MD)paint(focusSel,false)};
function closeWin(fromPop){if(!MD)return;const op=MD.opener;MD=null;ED=null;EDD=null;const m=$("#md");m.innerHTML="";m.style.display="none";lock();if(!fromPop&&history.state&&history.state.win){POPSKIP=true;history.back()}const t=op&&document.querySelector("#app "+op);if(t)try{t.focus()}catch(e){}}
function requestClose(after){if(!MD){if(after)after();return}if(SAVING)return;const go=()=>{closeWin(false);if(after)after()};if(dirty())askDiscard(go);else go()}
function winFail(e,what,retry){const msg=e&&e.code==="conflict"?e.message:errMsg(e,what);if(!MD)return toast(msg,true);MD.err=msg;MD.retry=retry||null;repaint('[data-a="retry"]');toast(msg,true)}
if(history.state&&history.state.win)history.replaceState(null,"");
addEventListener("popstate",()=>{if(POPSKIP){POPSKIP=false;return}if(!MD)return;if(dlgOpen()){const fn=CDNO;closeDlg(true);if(fn)fn();history.pushState({win:1},"");return}if(dirty()){history.pushState({win:1},"");askDiscard(()=>closeWin(false))}else closeWin(true)});
addEventListener("beforeunload",e=>{if(dirty()){e.preventDefault();e.returnValue=""}});
document.addEventListener("keydown",e=>{
 const d=$("#cd");
 if(dlgOpen()){if(e.key==="Escape"){e.preventDefault();const fn=CDNO;closeDlg(true);if(fn)fn();return}if(e.key==="Tab"){const f=[].slice.call(d.querySelectorAll("[data-cd]"));if(!f.length)return;const i=f.indexOf(document.activeElement);e.preventDefault();const n=e.shiftKey?(i<=0?f.length-1:i-1):(i>=f.length-1?0:i+1);f[n].focus()}return}
 if(!MD)return;
 if(e.key==="Escape"){e.preventDefault();requestClose();return}
 if(e.key==="Tab"){const f=[].slice.call($("#md").querySelectorAll('button:not([disabled]),input:not([type=hidden]),select,textarea,a[href]')).filter(x=>x.getClientRects().length);if(!f.length)return;const i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&(i<0||i===f.length-1)){e.preventDefault();f[0].focus()}}
});
$("#md").addEventListener("mousedown",e=>{MDDOWN=e.target});
$("#md").addEventListener("click",e=>{if(e.target.id==="md"&&MDDOWN===e.target)requestClose();MDDOWN=null});
$("#md").addEventListener("focusin",e=>{const t=e.target;if(t.matches&&t.matches("input,textarea,select"))setTimeout(()=>{try{t.scrollIntoView({block:"nearest"})}catch(x){}},250)});
/* phones: the window follows the visible viewport, so the keyboard shrinks it instead of covering the footer */
const VV=window.visualViewport;
function fitVV(){if(!VV)return;const m=$("#md");document.documentElement.style.setProperty("--vvh",VV.height+"px");if(m){m.style.top=VV.offsetTop+"px";m.style.height=VV.height+"px";m.style.bottom="auto";const a=document.activeElement;if(MD&&a&&m.contains(a)&&a.matches("input,textarea,select"))try{a.scrollIntoView({block:"nearest"})}catch(e){}}}
if(VV){VV.addEventListener("resize",fitVV);VV.addEventListener("scroll",fitVV)}

/* ---- busy state: one save at a time; the button shows progress and is disabled until it ends */
async function saving(btn,fn){if(SAVING)return;SAVING=true;const b=btn&&btn.closest?btn.closest("button"):null,h=b&&b.innerHTML;if(b){b.disabled=true;b.setAttribute("aria-busy","true");b.innerHTML='<span class="spin" aria-hidden="true"></span>'+(b.dataset.busy||"جارٍ الحفظ…")}try{return await fn()}finally{SAVING=false;if(b&&b.isConnected){b.disabled=false;b.removeAttribute("aria-busy");b.innerHTML=h}}}

/* ---- field errors: shown next to the field (aria-invalid + a message right after it), not only in a toast */
const fe=(err,k,id)=>err&&err[k]?` aria-invalid="true" aria-describedby="fe-${id}" data-ek="${k}"`:` data-ek="${k}"`;
const fd=(err,k,id)=>err&&err[k]?`<div class="sm dg ferr" id="fe-${id}" role="alert">${esc(err[k])}</div>`:"";
const FIRSTERR='#md [aria-invalid="true"]';

/* ---- storage. Every save is a transaction that reads the latest document and changes only its own item, so two tabs
   never undo each other's edits. Demo mode (no Firebase config) keeps the same shapes in localStorage. */
const T=15000;
const store={
 async load(){
  if(!live()){const x=localStorage.getItem("gqad");return fix(x?JSON.parse(x):{rev:1,surahs:clone(window.__D||[])})}
  const s=await withTimeout(FB.fs.getDoc(FB.fs.doc(FB.db,"public","data")),T);
  return fix(s.exists()?{rev:s.data().rev||0,surahs:s.data().surahs||[]}:{rev:0,surahs:[]});
 },
 // fn(latest surahs) returns the next surahs, or throws (conflict, duplicate...) to change nothing
 async update(fn){
  if(!live()){const x=localStorage.getItem("gqad"),cur=x?JSON.parse(x):{rev:D.rev,surahs:D.surahs};const next=fn(fix({surahs:clone(cur.surahs)}).surahs);chkSize(next);localStorage.setItem("gqap",JSON.stringify(cur));const r=(cur.rev||0)+1;localStorage.setItem("gqad",JSON.stringify({rev:r,surahs:next}));return fix({rev:r,surahs:next})}
  if(offline())throw errOf("offline");
  const{doc,runTransaction,serverTimestamp}=FB.fs;let out;
  await withTimeout(runTransaction(FB.db,async tx=>{
   const ref=doc(FB.db,"public","data"),cur=await tx.get(ref),ex=cur.exists(),cs=ex?cur.data().surahs||[]:[],cr=ex?cur.data().rev||0:0;
   const next=fn(fix({surahs:clone(cs)}).surahs);chkSize(next);
   if(ex)tx.set(doc(FB.db,"public","prev"),{rev:cr,surahs:cs,savedAt:serverTimestamp()});

function ayahErrors(segs,no,sName,ref){const r={};if(!(no>=1&&no<=114)){r.g0="لا يمكن التحقق من نص الآية لأن رقم سورة "+sName+" في المصحف غير معروف. صحّح رقمها من «تعديل سورة» ثم احفظ.";return r}
 AyahCheck.check(segs,no,ref).forEach(p=>{r["g"+p.i]=p.why==="num"?"لا توجد آية رقمها "+(String(p.num==null?"":p.num).trim()||"(فارغ)")+" في سورة "+sName+". صحّح رقم الآية لهذا الجزء.":"نص هذا الجزء لا يطابق نص الآية "+p.num+" من سورة "+sName+" في النص الرسمي لمجمّع الملك فهد لطباعة المصحف الشريف. انسخ النص منه كما هو، دون تعديل."});return r}
function wordErrors(x){const r={};if(!x.w.trim())r.w="اكتب الكلمة.";if(!x.m.trim())r.m="اكتب المعنى.";if(!String(x.label).trim())r.label="اكتب رقم الآية.";x.segs.forEach((g,i)=>{if(!g.hl.trim())r["g"+i]="اكتب النص المظلل لهذا الجزء."});return r}
async function saveW(btn,force){
 const x=ED;if(!x)return;
 x.err=wordErrors(x);if(Object.keys(x.err).length){MD.err="";repaint(FIRSTERR);return}
 const b=x.base,isNew=x.wi<0||x.gone,tName=nm(D.surahs[x.si]);
 const w=b&&!isNew&&x.w.trim()===String(b.w).trim()?b.w:x.w.trim();
 const m=b&&!isNew&&x.m.trim()===String(b.mShown).trim()?b.m:x.m.trim();
 const a=b&&!isNew&&String(x.label).trim()===b.label0.trim()&&JSON.stringify(x.segs)===b.segs0?b.ay:{label:String(x.label).trim(),segments:x.segs.map(g=>({num:+g.num||+x.label||0,before:g.before,hl:g.hl.trim(),after:g.after}))};
 // the ayah text must match the official text before anything is written
 let ref;try{ref=await quranRef()}catch(e){return winFail(e,"الحفظ",bb=>saveW(bb,force))}
 const ae=ayahErrors(a.segments,+(D.surahs[x.si]||{}).no,tName,ref);if(Object.keys(ae).length){x.err=ae;MD.err="";repaint(FIRSTERR);return}
 if(!isNew&&!x.warned){const used=daysUsing(b.no,b.w),moved=tName!==b.sName,renamed=NM(w)!==NM(b.w);
  if(used.length&&(moved||renamed))return ask({title:"الكلمة «"+b.w+"» مستخدمة في التحدي",body:"تستخدمها: "+DAYS(used)+". بعد تغيير "+(moved?"سورتها":"نصها")+" لن تجدها هذه الأيام، ولن تظهر فيها على الموقع حتى تعدّلها من تبويب «التحدي».",yes:"حفظ رغم ذلك",no:"رجوع",noIcon:IC_PEN,trig:btn,onYes:()=>{x.warned=true;saveW($('#md [data-a="saveW"]'),force)}})}
 await saving(btn,async()=>{
  try{
   const r=await store.update(ss=>{
    const ti=ss.findIndex(e=>nm(e)===tName);if(ti<0)throw errOf("conflict","حُذفت السورة المختارة في نافذة أخرى. اختر سورة أخرى ثم احفظ.");
    const t=ss[ti],entry=JSON.stringify([w,m,a]);
    if(isNew){const j=t.words.indexOf(w);if(j>=0){if(JSON.stringify([t.words[j],t.meanings[j],t.ayahs[j]])===entry)return ss;throw errOf("dup")}t.words.push(w);t.meanings.push(m);t.ayahs.push(a);return ss}
    const oi=ss.findIndex(e=>nm(e)===b.sName),o=oi<0?null:ss[oi],j=o?o.words.indexOf(b.w):-1;
    if(j<0)throw errOf("conflict","gone");
    if(!force&&JSON.stringify([o.words[j],o.meanings[j],o.ayahs[j]])!==b.key)throw errOf("conflict","changed");
    const k=t.words.indexOf(w);
    if(oi===ti){if(k>=0&&k!==j)throw errOf("dup");t.words[j]=w;t.meanings[j]=m;t.ayahs[j]=a}
    else{if(k>=0)throw errOf("dup");o.words.splice(j,1);o.meanings.splice(j,1);o.ayahs.splice(j,1);t.words.push(w);t.meanings.push(m);t.ayahs.push(a)}
    return ss});
   D=r;render();closeWin(false);toast("تم الحفظ، "+LATER+".");
  }catch(e){
   if(e.code==="dup"){x.err={w:"هذه الكلمة موجودة بالفعل في سورة "+tName+"."};MD.err="";return repaint(FIRSTERR)}
   if(e.code==="conflict"&&e.message==="gone")return winFail(errOf("conflict","حُذفت هذه الكلمة أو تغيّر نصها في نافذة أخرى بعد فتحها. تعديلاتك ما زالت هنا؛ «إعادة المحاولة» يحفظها كلمةً جديدة."),"الحفظ",bb=>{x.gone=true;saveW(bb,false)});
   if(e.code==="conflict"&&e.message==="changed")return winFail(errOf("conflict","تغيّرت هذه الكلمة في نافذة أخرى بعد فتحها. تعديلاتك ما زالت هنا؛ «إعادة المحاولة» يحفظها فوق التعديل الآخر."),"الحفظ",bb=>saveW(bb,true));
   winFail(e,"الحفظ",bb=>saveW(bb,force));
  }
 });
}

 else if(a==="chDay"){if(CH)openDay(v,btn)}

 else if(a==="chAddW"){if(!EDD)return;const x=EDD;delete x.err.add;if(x.addS===""||x.addW===""){x.err.add="اختر السورة ثم الكلمة.";return repaint('[data-f="c.addS"]')}const e=D.surahs[+x.addS],w=e&&e.words[+x.addW];if(!w){x.err.add="اختر السورة ثم الكلمة.";return repaint('[data-f="c.addS"]')}const ref=[e.no||0,N(w)];if(!wordOk(ref)){x.err.add="الكلمة غير موجودة في البيانات.";return repaint('[data-f="c.addS"]')}if(x.w.some(r=>r[0]===ref[0]&&NM(r[1])===NM(ref[1]))){x.err.add="هذه الكلمة مضافة إلى هذا اليوم بالفعل.";return repaint('[data-f="c.addS"]')}x.w.push(ref);x.addW="";repaint('[data-a="chAddW"]')}
 else if(a==="chSpin"){if(!EDD)return;const r=CL.rouletteSelect(EDD.w,{});if(!r)return;const el=$("#spinRes");if(el)el.textContent=String(r.value[1])}
 else if(a==="chSaveDay")saveDay(btn,false);
}

 const t=e.target,f=t.dataset.f;if(!f)return;

 else if(k[0]==="g")ED.segs[+k[1]][k[2]]=t.value;

/* sign-in state: a failed load shows a load error with a retry, never "not authorized" for an admin */
async function resolveUser(x){
 U=x;ADM=OWN=false;LOADERR=null;
 if(x&&x.emailVerified){
  OWN=x.email===OWNER;ADM=OWN;
  if(!ADM){try{ADM=(await store.admins()).map(s=>String(s).toLowerCase()).includes(x.email.toLowerCase())}catch(e){if(!e||e.code!=="permission-denied")LOADERR=e}}
  if(ADM&&!LOADERR){try{D=await store.load();AD=await store.admins().catch(()=>[]);CH=await store.chLoad();CHN=await store.chNotes()}catch(e){LOADERR=e}}
 }
 READY=true;
}
(async function(){
 try{
  if(!live()){U={email:OWNER};ADM=OWN=true;D=await store.load();AD=await store.admins();CH=await store.chLoad();CHN=await store.chNotes();READY=true;return render()}
  const u="https://www.gstatic.com/firebasejs/10.14.1/";

})();
