<style>:root{--bg:#F2F0E8;--tx:#1D2B25;--mu:#55645D;--ac:#1E6B50;--ln:rgba(29,43,37,.14);--gb:rgba(255,255,255,.62)}
@media(prefers-color-scheme:dark){:root{--bg:#0A0E1F;--tx:#ECEFFA;--mu:#A3ABC9;--ac:#9FB4FF;--ln:rgba(255,255,255,.13);--gb:rgba(255,255,255,.07)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans Arabic',sans-serif;line-height:1.8}
main{max-width:680px;margin:0 auto;padding:22px 18px 60px}a{color:var(--ac);text-decoration:none}.q{font-family:'Amiri Quran',serif}
.m{color:var(--mu);font-size:14px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.logo{font-size:27px}h1{font-size:44px;margin:8px 0;color:var(--ac);line-height:1.5}
.card{background:var(--gb);border:1px solid var(--ln);border-radius:18px;padding:16px;margin:12px 0}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--gb);border:1px solid var(--ln);border-radius:999px;padding:9px 16px;font-size:15px}
.cols{display:grid;gap:12px}@media(min-width:800px){.cols{grid-template-columns:1fr 1fr;align-items:start}}
.wd{font-size:40px;line-height:1.7;color:var(--ac);text-align:center;margin:2px 0 6px;padding:0 4px}
.ay{font-size:24px;line-height:2.15;text-align:center;padding:0 4px}mark{background:none;color:var(--ac);border-bottom:2px solid var(--ac)}
.mn{font-size:19px;line-height:1.9}.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:24px;background:var(--ac);color:var(--bg);font-weight:600;font-size:16px}
.btn.o{background:transparent;color:var(--ac);border:1px solid var(--ac)}h2{font-size:20px;margin:6px 0 12px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.chip{display:inline-block;background:var(--gb);border:1px solid var(--ln);border-radius:999px;padding:10px 16px;font-size:20px}
footer{margin-top:26px;text-align:center;border-top:1px solid var(--ln);padding-top:16px}.fl{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-bottom:8px;font-size:14px}.para{font-size:17px;line-height:1.95;margin:0 0 14px}</style>

<h1 class="q" style="font-size:40px">عن الموقع</h1>
<p class="para">غريب القرآن موقع يشرح معاني الكلمات الغريبة في القرآن الكريم بأسلوب مبسّط، ويعرض الآية ورقمها ومصدر المعنى.</p>
<p class="para">يبدأ الموقع بجزء عمّ، ثم يتوسّع تدريجيًا ليشمل بقية القرآن الكريم بإذن الله.</p>
