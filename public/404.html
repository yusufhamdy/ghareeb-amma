<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 | غريب القرآن</title>
<meta name="theme-color" content="#F2F0E8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--bg:#F2F0E8;--tx:#1D2B25;--mu:#55645D;--ac:#1E6B50;--ln:rgba(29,43,37,.14);--gb:rgba(255,255,255,.62)}
@media(prefers-color-scheme:dark){:root{--bg:#0A0E1F;--tx:#ECEFFA;--mu:#A3ABC9;--ac:#9FB4FF;--ln:rgba(255,255,255,.13);--gb:rgba(255,255,255,.07)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans Arabic',sans-serif;line-height:1.8}
main{max-width:680px;margin:0 auto;padding:22px 18px 60px}a{color:var(--ac);text-decoration:none}.q{font-family:'Amiri Quran',serif}
header{margin-bottom:12px}.logo{font-size:27px}
.card{background:var(--gb);border:1px solid var(--ln);border-radius:18px;padding:28px;margin:12px 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.nf{font-family:'Amiri Quran',serif;font-size:96px;color:var(--ac);line-height:1.3}
h1{font-size:24px;margin:0}.m{color:var(--mu);font-size:14px}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:24px;background:var(--ac);color:var(--bg);font-weight:600;font-size:16px}
.btn.o{background:transparent;color:var(--ac);border:1px solid var(--ac)}
</style>
</head>
<body>
<main>
<header><a class="logo q" href="/">غريب القرآن</a></header>
<div class="card">
<div class="nf">404</div>
<h1>الصفحة غير موجودة</h1>
<div class="m">ربما تغيّر الرابط أو لم تعد الصفحة متاحة.</div>
<div class="acts"><a class="btn" href="/">الرئيسية</a><a class="btn o" href="/#/surahs">تصفح بالسور</a></div>
</div>
</main>
</body>
</html>
